# EXPOSURE -----------------------------------
quarkus.http.host=127.0.0.1
quarkus.http.port=8087

# DB -----------------------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/gauge;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=update

# DESCRIPTIONS --------------------------------
# false (default): 4000-char cap on issue descriptions (POST and PATCH alike)
# true: cap lifted to the database limit (1,000,000 chars)
# gauge.issue.description.allow-long=false

# AUTH IS HERE -------------------------------
gauge.api-key.access=change-me2
gauge.api-key.pepper=change-me2
gauge.auth.admin.username=admin
gauge.auth.admin.password=admin
